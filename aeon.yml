# ─────────────────────────────────────────────
#  VIGIL — AI Agent Intelligence Feed
#  Automated by Aeon Framework
#  Output: GitHub Pages (docs/) + Telegram
# ─────────────────────────────────────────────

model: claude-sonnet-4-6

# ─── SKILL CHAINS ────────────────────────────
chains:
  morning-pipeline:
    schedule: "0 6 * * *"         # daily 6am UTC (1pm WIB)
    on_error: continue
    steps:
      - parallel:
          - token-movers
          - narrative-tracker
          - hacker-news-digest
          - reddit-digest
      - skill: morning-brief
        consume:
          - token-movers
          - narrative-tracker
          - hacker-news-digest
          - reddit-digest

  weekly-deep-dive:
    schedule: "0 8 * * 1"         # every Monday 8am UTC
    on_error: continue
    steps:
      - skill: deep-research
      - skill: article
        consume: [deep-research]
      - skill: update-gallery
        consume: [article]

  agent-token-report:
    schedule: "0 12 * * *"        # daily 12pm UTC (7pm WIB)
    on_error: continue
    steps:
      - parallel:
          - token-report
          - on-chain-monitor
          - defi-overview
      - skill: article
        consume: [token-report, on-chain-monitor, defi-overview]

# ─── SKILLS ──────────────────────────────────
skills:

  # ── RESEARCH & CONTENT ──────────────────────

  deep-research:
    enabled: true
    schedule: "0 3 * * 1"        # Monday 3am UTC (weekly)
    var: "AI agents on-chain Virtuals ai16z TAO FET ODAI ecosystem"
    model: claude-sonnet-4-6

  paper-digest:
    enabled: true
    schedule: "0 4 * * 3"        # Wednesday 4am UTC
    var: "autonomous AI agents multi-agent systems LLM reasoning"

  paper-pick:
    enabled: true
    schedule: "0 4 * * 6"        # Saturday 4am UTC
    var: "AI agent architecture crypto integration"

  hacker-news-digest:
    enabled: true
    schedule: "0 5 * * *"        # daily 5am UTC
    var: "AI agents autonomous systems on-chain"

  reddit-digest:
    enabled: true
    schedule: "0 5 * * *"        # daily 5am UTC
    var: "AI agents crypto Virtuals ai16z Bittensor"

  rss-digest:
    enabled: true
    schedule: "0 5 * * *"        # daily 5am UTC
    var: "AI agent news crypto intelligence"

  article:
    enabled: true
    schedule: "0 9 * * *"        # daily 9am UTC (4pm WIB)
    var: "AI agent ecosystem intelligence brief VIGIL"
    model: claude-sonnet-4-6

  digest:
    enabled: true
    schedule: "0 7 * * *"        # daily 7am UTC (2pm WIB)
    var: "AI agents on-chain infrastructure Virtuals ai16z TAO FET ODAI"

  research-brief:
    enabled: true
    schedule: "0 6 * * 2,4"      # Tuesday & Thursday 6am UTC
    var: "AI agent token market structure narrative"

  technical-explainer:
    enabled: true
    schedule: "0 8 * * 5"        # Friday 8am UTC
    var: "how AI agents work on-chain infrastructure explained"

  list-digest:
    enabled: true
    schedule: "0 6 * * 0"        # Sunday 6am UTC
    var: "top AI agent projects this week Virtuals ai16z TAO FET ODAI"

  # ── CRYPTO & MARKETS ────────────────────────

  token-report:
    enabled: true
    schedule: "30 11 * * *"      # daily 11:30am UTC (6:30pm WIB)
    var: "FET TAO RENDER VIRTUAL ai16z ODAI"
    model: claude-sonnet-4-6

  token-movers:
    enabled: true
    schedule: "0 5 * * *"        # daily 5am UTC
    var: "AI agent tokens FET TAO RENDER VIRTUAL ODAI"

  token-alert:
    enabled: true
    schedule: "reactive"
    var: "FET TAO RENDER VIRTUAL ODAI"

  narrative-tracker:
    enabled: true
    schedule: "0 4 * * *"        # daily 4am UTC
    var: "AI agents on-chain autonomous crypto narrative"

  on-chain-monitor:
    enabled: true
    schedule: "0 10 * * *"       # daily 10am UTC
    var: "Virtuals Protocol ai16z Bittensor on-chain activity"

  defi-overview:
    enabled: true
    schedule: "0 11 * * *"       # daily 11am UTC
    var: "AI agent DeFi protocols liquidity staking"

  defi-monitor:
    enabled: true
    schedule: "0 10 * * 1,4"     # Monday & Thursday 10am UTC
    var: "AI agent token DeFi activity Virtuals ai16z"

  # ── PRODUCTIVITY & BRIEFS ───────────────────

  morning-brief:
    enabled: true
    schedule: "0 6 * * *"        # daily 6am UTC (1pm WIB)
    var: "AI agent crypto intelligence VIGIL daily"

  evening-recap:
    enabled: true
    schedule: "0 14 * * *"       # daily 2pm UTC (9pm WIB)
    var: "AI agent market close summary"

  weekly-review:
    enabled: true
    schedule: "0 7 * * 1"        # Monday 7am UTC
    var: "AI agent ecosystem weekly performance narrative shift"

  # ── SOCIAL & CONTENT DISTRIBUTION ──────────

  write-tweet:
    enabled: true
    schedule: "0 10 * * *"       # daily 10am UTC
    var: "AI agent crypto insight VIGIL feed"

  agent-buzz:
    enabled: true
    schedule: "0 9 * * 2,5"      # Tuesday & Friday 9am UTC
    var: "Virtuals ai16z TAO FET ODAI agent news"

  # ── PUBLISHING ──────────────────────────────

  rss-feed:
    enabled: true
    schedule: "30 9 * * *"       # daily 9:30am UTC (after article runs)

  update-gallery:
    enabled: true
    schedule: "0 10 * * *"       # daily 10am UTC
    var: "VIGIL AI agent intelligence feed"

  # ── META / SELF-HEALING ─────────────────────

  skill-health:
    enabled: true
    schedule: "0 0 * * *"        # midnight UTC daily

  skill-repair:
    enabled: true
    schedule: "reactive"
    # auto-fires if any skill fails 3x in a row

  self-improve:
    enabled: true
    schedule: "0 2 * * 0"        # Sunday 2am UTC

  cost-report:
    enabled: true
    schedule: "0 0 * * 1"        # Monday midnight UTC

  reflect:
    enabled: true
    schedule: "0 1 * * 0"        # Sunday 1am UTC

  heartbeat:
    enabled: true
    schedule: "0 */8 * * *"      # every 8 hours — always last

# ─── REACTIVE TRIGGERS ───────────────────────
reactive:
  skill-repair:
    trigger:
      - { on: "*", when: "consecutive_failures >= 3" }
  token-alert:
    trigger:
      - { on: "token-movers", when: "price_change >= 10" }
